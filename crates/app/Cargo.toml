[package]
name = "napkin"
description = "A natural-language calculator for Linux, at home on Omarchy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
napkin-engine = { workspace = true }
napkin-rates = { workspace = true }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_8"] }
async-channel = "2"
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = "0.1.65"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1.8"
dirs = { workspace = true }
